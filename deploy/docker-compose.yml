# ============================================================
# 邻里鲜生 · 一键启动（MySQL 8.0 + Redis 7 + 后端 API）
#
# 启动：cp deploy/.env.example deploy/.env
#       docker compose -f deploy/docker-compose.yml up -d --build
# 状态：docker compose -f deploy/docker-compose.yml ps
# 日志：docker compose -f deploy/docker-compose.yml logs -f api
# 停止：docker compose -f deploy/docker-compose.yml down
# 清库：docker compose -f deploy/docker-compose.yml down -v
#
# 首次启动由 MySQL 官方入口脚本自动导入 schema.sql 与 init_data.sql，
# 文件名前缀 01/02 保证建表先于初始化数据执行。
# ============================================================
name: linli-fresh

services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.0
    container_name: linli-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-linli_fresh}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docs/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../docs/sql/init_data.sql:/docker-entrypoint-initdb.d/02-init_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: linli-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: linli-mall-api:${IMAGE_TAG:-local}
    container_name: linli-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: Asia/Shanghai
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-linli_fresh}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root123456}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql-data:
  redis-data:
